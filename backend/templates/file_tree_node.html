<ul class="space-y-1">
{% for node in nodes %}
    <li>
    {% if node.type == 'folder' %}
        <details open>
            <summary class="group flex items-center px-2 py-1 text-sm font-medium text-gray-600 rounded-md hover:text-gray-900 hover:bg-gray-50 cursor-pointer list-none select-none" onclick="showSummary(event, 'folder-{{ node.obj.folder_id }}', '{{ node.obj.name|escapejs }}', '{{ node.obj.path|default:"/"|escapejs }}', false)">
                <i class="fas fa-folder mr-2 text-gray-400 group-hover:text-gray-500"></i>
                {{ node.obj.name }}
            </summary>
            <div id="folder-{{ node.obj.folder_id }}" style="display:none;">{{ node.obj.ai_summary|default:"" }}</div>
            <div class="ml-4 border-l border-gray-200 pl-2">
                {% include "file_tree_node.html" with nodes=node.children %}
            </div>
        </details>
    {% else %}
        <a href="#" class="group flex items-center px-2 py-1 text-sm font-medium text-gray-600 rounded-md hover:text-gray-900 hover:bg-gray-50" onclick="showSummary(event, 'file-{{ node.obj.file_id }}', '{{ node.obj.name|escapejs }}', '{{ node.obj.folder.path|default:"" }}/{{ node.obj.name|escapejs }}', true)">
            <i class="fas fa-file mr-2 text-gray-400 group-hover:text-gray-500"></i>
            {{ node.obj.name }}
        </a>
        <div id="file-{{ node.obj.file_id }}" style="display:none;">{{ node.obj.ai_summary|default:"" }}</div>
    {% endif %}
    </li>
{% endfor %}
</ul>
